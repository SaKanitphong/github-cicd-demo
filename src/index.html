<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub CI/CD Demo</title>
<style>
  :root { --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align:center; padding:24px; }
  h1 { font-size: clamp(2rem, 6vw, 3.5rem); color: var(--accent); }
  p  { margin-top:12px; color:var(--muted); }
  footer { margin-top:40px; font: 0.8rem ui-monospace, Menlo, monospace; color:var(--muted); }
</style>
</head>
<body>
  <main>
    <h1>Hello, Team</h1>
    <p>This page is deployed by GitHub Actions.</p>
    <footer>commit {{COMMIT_SHA}} &middot; run #{{RUN_NUMBER}} &middot; built {{BUILD_TIME}}</footer>
  </main>
</body>
</html>
